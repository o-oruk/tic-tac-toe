<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      color: #1d1d1f;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.2rem;
    }

    #subtitle {
      font-size: 0.88rem;
      color: #6e6e73;
      margin-bottom: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge.you { background: #e3f0fd; color: #0071e3; }
    .badge.cpu { background: #e6f9ee; color: #1a7f37; }

    #difficulty-bar {
      display: flex;
      background: #e5e5ea;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 1.1rem;
    }

    #difficulty-bar button {
      border: none;
      background: transparent;
      padding: 0.38rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #6e6e73;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.18s, color 0.18s;
    }

    #difficulty-bar button.active {
      background: #fff;
      color: #1d1d1f;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    #status {
      font-size: 1rem;
      font-weight: 500;
      color: #6e6e73;
      margin-bottom: 1rem;
      height: 1.4rem;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 148px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
    }

    .cell {
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
      user-select: none;
      padding: 10px 8px;
      overflow: hidden;
    }

    .cell svg { width: 100%; height: 100%; }

    .cell:hover:not(.taken) {
      background: #f0f0f5;
      transform: scale(1.03);
      box-shadow: 0 4px 14px rgba(0,0,0,0.11);
    }

    .cell.bmw.win {
      background: #deeeff;
      box-shadow: 0 0 0 2.5px #0071e3;
      animation: pulse 0.45s ease;
    }

    .cell.byd.win {
      background: #dcf5e5;
      box-shadow: 0 0 0 2.5px #1a7f37;
      animation: pulse 0.45s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    #scores {
      display: flex;
      gap: 0.9rem;
      margin: 1.3rem 0 0.7rem;
    }

    .score-box {
      text-align: center;
      background: #fff;
      padding: 0.5rem 1.1rem;
      border-radius: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      min-width: 90px;
    }

    .score-box .label {
      font-size: 0.68rem;
      font-weight: 500;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .score-box .value {
      display: block;
      font-size: 1.65rem;
      font-weight: 700;
      margin-top: 0.05rem;
    }

    .score-box.you .value  { color: #0071e3; }
    .score-box.cpu .value  { color: #1a7f37; }
    .score-box.draw .value { color: #6e6e73; }

    #restart {
      margin-top: 1rem;
      padding: 0.6rem 2.2rem;
      background: #0071e3;
      border: none;
      border-radius: 980px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.18s, transform 0.1s;
    }

    #restart:hover  { background: #0077ed; transform: scale(1.04); }
    #restart:active { background: #005bb5; }

    #go-first-notice {
      font-size: 0.8rem;
      color: #6e6e73;
      margin-top: 0.5rem;
      height: 1rem;
    }
  </style>
</head>
<body>

<!-- Shared SVG gradient defs (referenced by all inline SVGs) -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bmwBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ab4ff"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="bmwGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9eeff"/>
      <stop offset="100%" stop-color="#a8d6ff"/>
    </linearGradient>
    <linearGradient id="bydBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#1a7f37"/>
    </linearGradient>
    <linearGradient id="bydGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2f0d1"/>
      <stop offset="100%" stop-color="#90dba8"/>
    </linearGradient>
  </defs>
</svg>

<h1>Tic Tac Toe</h1>
<p id="subtitle">
  <span class="badge you">You · BMW X5</span>
  vs
  <span class="badge cpu">CPU · BYD Leopard</span>
</p>

<div id="difficulty-bar">
  <button data-level="easy">Easy</button>
  <button data-level="medium" class="active">Medium</button>
  <button data-level="hard">Hard</button>
</div>

<div id="status">Loading…</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="scores">
  <div class="score-box you">
    <div class="label">BMW X5</div>
    <span class="value" id="you-score">0</span>
  </div>
  <div class="score-box draw">
    <div class="label">Draw</div>
    <span class="value" id="draw-score">0</span>
  </div>
  <div class="score-box cpu">
    <div class="label">BYD Leopard</div>
    <span class="value" id="cpu-score">0</span>
  </div>
</div>

<button id="restart">New Game</button>
<div id="go-first-notice"></div>

<script>
// ── Car SVG drawings ────────────────────────────────────────────────────────

const BMW_SVG = `<svg viewBox="0 0 120 68" xmlns="http://www.w3.org/2000/svg">
  <!-- BMW X5 — luxury SUV side profile, Apple style -->

  <!-- Body -->
  <path d="M6,50 L6,40 Q7,31 13,27 L25,23 L40,23 L46,13 L83,13 L89,17 L95,23
           Q109,32 113,42 L113,50 Z"
        fill="url(#bmwBody)" stroke="#005ab5" stroke-width="0.7"/>

  <!-- Windows -->
  <path d="M43,22 L49,14 L83,14 L87,18 L87,22 Z"
        fill="url(#bmwGlass)" opacity="0.92"/>

  <!-- A-pillar divider -->
  <line x1="43" y1="14" x2="43" y2="22" stroke="#005ab5" stroke-width="1.4"/>

  <!-- Rear door line -->
  <line x1="67" y1="22" x2="67" y2="50" stroke="#005ab5" stroke-width="0.7" opacity="0.3"/>

  <!-- BMW kidney grille (front, simplified) -->
  <path d="M6,36 L6,45 Q6.5,47 8.5,47 L11,47 L11,36 Z"
        fill="#002c6d" opacity="0.75"/>

  <!-- Headlight strip -->
  <path d="M7,28 L13,25 L15,32 L7,34 Z" fill="white" opacity="0.92"/>
  <line x1="7" y1="28" x2="15" y2="26" stroke="#ffe066" stroke-width="1.6" opacity="0.8"/>

  <!-- Side character line -->
  <path d="M14,34 Q62,31 111,38" stroke="#005ab5" stroke-width="0.7" fill="none" opacity="0.35"/>

  <!-- Taillight -->
  <rect x="110" y="29" width="3" height="15" rx="1.5" fill="#ff3b30" opacity="0.88"/>

  <!-- Front wheel arch shadow -->
  <path d="M17,50 Q28,37 39,50" fill="#0058b0" opacity="0.45"/>
  <!-- Rear wheel arch shadow -->
  <path d="M75,50 Q90,37 105,50" fill="#0058b0" opacity="0.45"/>

  <!-- Front wheel -->
  <circle cx="28" cy="52" r="10" fill="#1d1d1f"/>
  <circle cx="28" cy="52" r="6.8" fill="#48484a"/>
  <circle cx="28" cy="52" r="2.6" fill="#aeaeb2"/>
  <line x1="28" y1="45.2" x2="28" y2="58.8" stroke="#aeaeb2" stroke-width="1.2"/>
  <line x1="21.2" y1="52" x2="34.8" y2="52" stroke="#aeaeb2" stroke-width="1.2"/>
  <line x1="23.1" y1="47.1" x2="32.9" y2="56.9" stroke="#aeaeb2" stroke-width="1.2"/>
  <line x1="23.1" y1="56.9" x2="32.9" y2="47.1" stroke="#aeaeb2" stroke-width="1.2"/>

  <!-- Rear wheel -->
  <circle cx="90" cy="52" r="10" fill="#1d1d1f"/>
  <circle cx="90" cy="52" r="6.8" fill="#48484a"/>
  <circle cx="90" cy="52" r="2.6" fill="#aeaeb2"/>
  <line x1="90" y1="45.2" x2="90" y2="58.8" stroke="#aeaeb2" stroke-width="1.2"/>
  <line x1="83.2" y1="52" x2="96.8" y2="52" stroke="#aeaeb2" stroke-width="1.2"/>
  <line x1="85.1" y1="47.1" x2="94.9" y2="56.9" stroke="#aeaeb2" stroke-width="1.2"/>
  <line x1="85.1" y1="56.9" x2="94.9" y2="47.1" stroke="#aeaeb2" stroke-width="1.2"/>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="64" rx="54" ry="2.5" fill="#0071e3" opacity="0.07"/>
</svg>`;

const BYD_SVG = `<svg viewBox="0 0 120 68" xmlns="http://www.w3.org/2000/svg">
  <!-- BYD Leopard — rugged angular SUV, Apple style -->

  <!-- Body (boxy, upright) -->
  <path d="M6,50 L6,21 L16,12 L87,12 L93,16 L99,21 L115,30 L115,50 Z"
        fill="url(#bydBody)" stroke="#145f28" stroke-width="0.7"/>

  <!-- Roof rack -->
  <rect x="16" y="9.5" width="71" height="3" rx="1.5" fill="#104c22"/>

  <!-- Windows (rectangular) -->
  <path d="M19,20 L19,13 L85,13 L91,17 L91,21 Z"
        fill="url(#bydGlass)" opacity="0.9"/>

  <!-- B-pillar -->
  <rect x="54" y="12" width="3" height="9" fill="#104c22"/>

  <!-- Headlight (round LED, BYD signature) -->
  <circle cx="9" cy="27" r="6.5" fill="white" opacity="0.9"/>
  <circle cx="9" cy="27" r="4" fill="#ffe066" opacity="0.75"/>
  <circle cx="9" cy="27" r="1.8" fill="#ffd700" opacity="0.9"/>

  <!-- Front grille (aggressive vertical bars) -->
  <rect x="6" y="35" width="10" height="12" rx="1" fill="#0d3d1a" opacity="0.9"/>
  <line x1="11" y1="35" x2="11" y2="47" stroke="#1a7f37" stroke-width="0.8"/>

  <!-- Side step / cladding -->
  <rect x="19" y="43" width="82" height="5.5" rx="2" fill="#145f28" opacity="0.5"/>

  <!-- Taillight (full vertical bar) -->
  <rect x="112" y="21" width="3" height="20" rx="1.5" fill="#ff9500" opacity="0.9"/>

  <!-- Front wheel arch -->
  <path d="M14,50 Q28,36 42,50" fill="#104c22" opacity="0.45"/>
  <!-- Rear wheel arch -->
  <path d="M74,50 Q90,36 106,50" fill="#104c22" opacity="0.45"/>

  <!-- Front wheel (chunky, off-road) -->
  <circle cx="28" cy="53" r="11.5" fill="#1d1d1f"/>
  <circle cx="28" cy="53" r="7.8" fill="#48484a"/>
  <circle cx="28" cy="53" r="3" fill="#aeaeb2"/>
  <line x1="28" y1="45.5" x2="28" y2="60.5" stroke="#aeaeb2" stroke-width="1.9"/>
  <line x1="20.5" y1="53" x2="35.5" y2="53" stroke="#aeaeb2" stroke-width="1.9"/>
  <line x1="22.9" y1="47.9" x2="33.1" y2="58.1" stroke="#aeaeb2" stroke-width="1.9"/>
  <line x1="22.9" y1="58.1" x2="33.1" y2="47.9" stroke="#aeaeb2" stroke-width="1.9"/>

  <!-- Rear wheel (chunky, off-road) -->
  <circle cx="90" cy="53" r="11.5" fill="#1d1d1f"/>
  <circle cx="90" cy="53" r="7.8" fill="#48484a"/>
  <circle cx="90" cy="53" r="3" fill="#aeaeb2"/>
  <line x1="90" y1="45.5" x2="90" y2="60.5" stroke="#aeaeb2" stroke-width="1.9"/>
  <line x1="82.5" y1="53" x2="97.5" y2="53" stroke="#aeaeb2" stroke-width="1.9"/>
  <line x1="84.9" y1="47.9" x2="95.1" y2="58.1" stroke="#aeaeb2" stroke-width="1.9"/>
  <line x1="84.9" y1="58.1" x2="95.1" y2="47.9" stroke="#aeaeb2" stroke-width="1.9"/>

  <!-- Ground shadow -->
  <ellipse cx="62" cy="66" rx="54" ry="2.2" fill="#1a7f37" opacity="0.08"/>
</svg>`;

// ── Game logic ───────────────────────────────────────────────────────────────

const WINS = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

const PLAYER = 'X', CPU = 'O';
let board, current, over, boardLocked;
let difficulty = 'medium';
let scores = { you: 0, cpu: 0, draw: 0 };

const cells     = document.querySelectorAll('.cell');
const statusEl  = document.getElementById('status');
const youScore  = document.getElementById('you-score');
const cpuScore  = document.getElementById('cpu-score');
const drawScore = document.getElementById('draw-score');
const notice    = document.getElementById('go-first-notice');

document.querySelectorAll('#difficulty-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#difficulty-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.level;
    init();
  });
});

function init() {
  board       = Array(9).fill('');
  over        = false;
  boardLocked = false;
  cells.forEach(c => { c.innerHTML = ''; c.className = 'cell'; });

  const cpuFirst = Math.random() < 0.5;
  current = cpuFirst ? CPU : PLAYER;

  if (cpuFirst) {
    notice.textContent   = 'BYD Leopard goes first this round';
    statusEl.textContent = 'CPU is thinking…';
    boardLocked = true;
    setTimeout(() => { cpuMove(); boardLocked = false; }, 520);
  } else {
    notice.textContent   = 'BMW X5 goes first — your turn!';
    statusEl.textContent = 'Your turn';
  }
}

function checkWinner(b) {
  for (const [a, bI, c] of WINS) {
    if (b[a] && b[a] === b[bI] && b[a] === b[c]) return { winner: b[a], line: [a, bI, c] };
  }
  if (b.every(v => v)) return { winner: null, line: [] };
  return null;
}

function place(idx, mark) {
  board[idx] = mark;
  const isPlayer = mark === PLAYER;
  cells[idx].innerHTML = isPlayer ? BMW_SVG : BYD_SVG;
  cells[idx].classList.add('taken', isPlayer ? 'bmw' : 'byd');
}

function endGame(result) {
  over = true;
  if (result.winner === PLAYER) {
    result.line.forEach(i => cells[i].classList.add('win'));
    statusEl.textContent = 'BMW X5 wins!';
    scores.you++;
  } else if (result.winner === CPU) {
    result.line.forEach(i => cells[i].classList.add('win'));
    statusEl.textContent = 'BYD Leopard wins!';
    scores.cpu++;
  } else {
    statusEl.textContent = "It's a draw!";
    scores.draw++;
  }
  youScore.textContent  = scores.you;
  cpuScore.textContent  = scores.cpu;
  drawScore.textContent = scores.draw;
}

function emptyCells(b) { return b.map((v,i) => v ? null : i).filter(i => i !== null); }

function minimax(b, isMax) {
  const res = checkWinner(b);
  if (res) {
    if (res.winner === CPU)    return  10;
    if (res.winner === PLAYER) return -10;
    return 0;
  }
  const moves = emptyCells(b);
  const sc = moves.map(i => {
    const nb = [...b];
    nb[i] = isMax ? CPU : PLAYER;
    return minimax(nb, !isMax);
  });
  return isMax ? Math.max(...sc) : Math.min(...sc);
}

function bestMove(b) {
  let best = -Infinity, move = -1;
  emptyCells(b).forEach(i => {
    const nb = [...b]; nb[i] = CPU;
    const s = minimax(nb, false);
    if (s > best) { best = s; move = i; }
  });
  return move;
}

function winOrBlock(b) {
  for (const i of emptyCells(b)) {
    const nb = [...b]; nb[i] = CPU;
    if (checkWinner(nb)?.winner === CPU) return i;
  }
  for (const i of emptyCells(b)) {
    const nb = [...b]; nb[i] = PLAYER;
    if (checkWinner(nb)?.winner === PLAYER) return i;
  }
  return null;
}

function cpuMove() {
  const empty = emptyCells(board);
  if (!empty.length) return;
  let idx;
  if (difficulty === 'easy') {
    idx = Math.random() < 0.8
      ? empty[Math.floor(Math.random() * empty.length)]
      : bestMove(board);
  } else if (difficulty === 'medium') {
    idx = winOrBlock(board) ?? empty[Math.floor(Math.random() * empty.length)];
  } else {
    idx = bestMove(board);
  }
  place(idx, CPU);
  const result = checkWinner(board);
  if (result) { endGame(result); return; }
  current = PLAYER;
  statusEl.textContent = 'Your turn';
}

cells.forEach(cell => {
  cell.addEventListener('click', () => {
    const i = +cell.dataset.i;
    if (over || boardLocked || board[i] || current !== PLAYER) return;
    place(i, PLAYER);
    const result = checkWinner(board);
    if (result) { endGame(result); return; }
    current = CPU;
    statusEl.textContent = 'CPU is thinking…';
    boardLocked = true;
    setTimeout(() => { cpuMove(); boardLocked = false; }, 400);
  });
});

document.getElementById('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
