<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      color: #1d1d1f;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.2rem;
    }

    #subtitle {
      font-size: 0.88rem;
      color: #6e6e73;
      margin-bottom: 1.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .badge.you { background: #fff3e0; color: #e65100; }
    .badge.cpu { background: #f3e5f5; color: #7b1fa2; }

    #difficulty-bar {
      display: flex;
      background: #e5e5ea;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 1.1rem;
    }

    #difficulty-bar button {
      border: none;
      background: transparent;
      padding: 0.38rem 1.1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #6e6e73;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.18s, color 0.18s;
    }

    #difficulty-bar button.active {
      background: #fff;
      color: #1d1d1f;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    #status {
      font-size: 1rem;
      font-weight: 500;
      color: #6e6e73;
      margin-bottom: 1rem;
      height: 1.4rem;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 10px;
    }

    .cell {
      background: #fff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
      user-select: none;
      padding: 14px;
      overflow: hidden;
    }

    .cell svg { width: 100%; height: 100%; }

    .cell:hover:not(.taken) {
      background: #f0f0f5;
      transform: scale(1.04);
      box-shadow: 0 4px 14px rgba(0,0,0,0.11);
    }

    .cell.carrot.win {
      background: #fff3e0;
      box-shadow: 0 0 0 2.5px #FF9500;
      animation: pulse 0.45s ease;
    }

    .cell.grape.win {
      background: #f3e5f5;
      box-shadow: 0 0 0 2.5px #AF52DE;
      animation: pulse 0.45s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.09); }
      100% { transform: scale(1); }
    }

    #scores {
      display: flex;
      gap: 0.9rem;
      margin: 1.3rem 0 0.7rem;
    }

    .score-box {
      text-align: center;
      background: #fff;
      padding: 0.5rem 1.1rem;
      border-radius: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      min-width: 88px;
    }

    .score-box .label {
      font-size: 0.68rem;
      font-weight: 500;
      color: #6e6e73;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .score-box .value {
      display: block;
      font-size: 1.65rem;
      font-weight: 700;
      margin-top: 0.05rem;
    }

    .score-box.you .value  { color: #FF9500; }
    .score-box.cpu .value  { color: #AF52DE; }
    .score-box.draw .value { color: #6e6e73; }

    #restart {
      margin-top: 1rem;
      padding: 0.6rem 2.2rem;
      background: #1d1d1f;
      border: none;
      border-radius: 980px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.18s, transform 0.1s;
    }

    #restart:hover  { background: #3a3a3c; transform: scale(1.04); }
    #restart:active { background: #000; }

    #go-first-notice {
      font-size: 0.8rem;
      color: #6e6e73;
      margin-top: 0.5rem;
      height: 1rem;
    }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<p id="subtitle">
  <span class="badge you">You · Carrot</span>
  vs
  <span class="badge cpu">CPU · Grape</span>
</p>

<div id="difficulty-bar">
  <button data-level="easy">Easy</button>
  <button data-level="medium" class="active">Medium</button>
  <button data-level="hard">Hard</button>
</div>

<div id="status">Loading…</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="scores">
  <div class="score-box you">
    <div class="label">Carrot</div>
    <span class="value" id="you-score">0</span>
  </div>
  <div class="score-box draw">
    <div class="label">Draw</div>
    <span class="value" id="draw-score">0</span>
  </div>
  <div class="score-box cpu">
    <div class="label">Grape</div>
    <span class="value" id="cpu-score">0</span>
  </div>
</div>

<button id="restart">New Game</button>
<div id="go-first-notice"></div>

<script>
// ── SVG illustrations ────────────────────────────────────────────────────────

const CARROT_SVG = `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Carrot — Apple style -->

  <!-- Leaves -->
  <path d="M40,26 C39,18 34,8 28,6 C31,12 37,20 40,26" fill="#34C759"/>
  <path d="M40,26 C40,16 40,6 40,2 C40,9 40,18 40,26" fill="#30D158"/>
  <path d="M40,26 C41,18 46,8 52,6 C49,12 43,20 40,26" fill="#34C759"/>
  <path d="M39,25 C35,15 26,10 21,13 C26,16 35,22 39,25" fill="#30D158"/>
  <path d="M41,25 C45,15 54,10 59,13 C54,16 45,22 41,25" fill="#30D158"/>

  <!-- Carrot body -->
  <path d="M27,27 Q40,22 53,27 L44,72 Q40,76 36,72 Z"
        fill="#FF9500"/>

  <!-- Body highlight -->
  <path d="M32,30 Q40,26 46,30 L41,58 Q40,60 39,58 Z"
        fill="#FFBF40" opacity="0.45"/>

  <!-- Texture lines -->
  <path d="M33,36 Q40,33 47,36" stroke="#E07800" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M31,46 Q40,43 49,46" stroke="#E07800" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M30,56 Q40,53 50,56" stroke="#E07800" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Shadow at base -->
  <ellipse cx="40" cy="71" rx="7" ry="2" fill="#cc6d00" opacity="0.25"/>
</svg>`;

const GRAPE_SVG = `<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Grape cluster — Apple style -->

  <!-- Stem -->
  <path d="M40,16 Q44,10 48,8" stroke="#8B6914" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M48,8 C54,4 58,8 54,13 C52,10 49,9 48,8" fill="#34C759" opacity="0.85"/>

  <!-- Grape circles — triangular cluster (top-heavy) -->
  <!-- Row 1: 3 grapes -->
  <circle cx="27" cy="28" r="11" fill="#BF5AF2"/>
  <circle cx="40" cy="28" r="11" fill="#AF52DE"/>
  <circle cx="53" cy="28" r="11" fill="#BF5AF2"/>
  <!-- Row 2: 2 grapes -->
  <circle cx="33" cy="42" r="11" fill="#AF52DE"/>
  <circle cx="47" cy="42" r="11" fill="#BF5AF2"/>
  <!-- Row 3: 1 grape -->
  <circle cx="40" cy="56" r="11" fill="#AF52DE"/>

  <!-- Shine on each grape -->
  <circle cx="23" cy="24" r="3.5" fill="white" opacity="0.35"/>
  <circle cx="36" cy="24" r="3.5" fill="white" opacity="0.35"/>
  <circle cx="49" cy="24" r="3.5" fill="white" opacity="0.35"/>
  <circle cx="29" cy="38" r="3.5" fill="white" opacity="0.35"/>
  <circle cx="43" cy="38" r="3.5" fill="white" opacity="0.35"/>
  <circle cx="36" cy="52" r="3.5" fill="white" opacity="0.35"/>

  <!-- Cluster shadow -->
  <ellipse cx="40" cy="69" rx="18" ry="3" fill="#7b1fa2" opacity="0.1"/>
</svg>`;

// ── Game logic ───────────────────────────────────────────────────────────────

const WINS = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

const PLAYER = 'X', CPU = 'O';
let board, current, over, boardLocked;
let difficulty = 'medium';
let scores = { you: 0, cpu: 0, draw: 0 };

const cells     = document.querySelectorAll('.cell');
const statusEl  = document.getElementById('status');
const youScore  = document.getElementById('you-score');
const cpuScore  = document.getElementById('cpu-score');
const drawScore = document.getElementById('draw-score');
const notice    = document.getElementById('go-first-notice');

document.querySelectorAll('#difficulty-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#difficulty-bar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.level;
    init();
  });
});

function init() {
  board       = Array(9).fill('');
  over        = false;
  boardLocked = false;
  cells.forEach(c => { c.innerHTML = ''; c.className = 'cell'; });

  const cpuFirst = Math.random() < 0.5;
  current = cpuFirst ? CPU : PLAYER;

  if (cpuFirst) {
    notice.textContent   = 'Grape goes first this round';
    statusEl.textContent = 'CPU is thinking…';
    boardLocked = true;
    setTimeout(() => { cpuMove(); boardLocked = false; }, 520);
  } else {
    notice.textContent   = 'Carrot goes first — your turn!';
    statusEl.textContent = 'Your turn';
  }
}

function checkWinner(b) {
  for (const [a, bI, c] of WINS) {
    if (b[a] && b[a] === b[bI] && b[a] === b[c]) return { winner: b[a], line: [a, bI, c] };
  }
  if (b.every(v => v)) return { winner: null, line: [] };
  return null;
}

function place(idx, mark) {
  board[idx] = mark;
  const isPlayer = mark === PLAYER;
  cells[idx].innerHTML = isPlayer ? CARROT_SVG : GRAPE_SVG;
  cells[idx].classList.add('taken', isPlayer ? 'carrot' : 'grape');
}

function endGame(result) {
  over = true;
  if (result.winner === PLAYER) {
    result.line.forEach(i => cells[i].classList.add('win'));
    statusEl.textContent = 'Carrot wins! 🥕';
    scores.you++;
  } else if (result.winner === CPU) {
    result.line.forEach(i => cells[i].classList.add('win'));
    statusEl.textContent = 'Grape wins! 🍇';
    scores.cpu++;
  } else {
    statusEl.textContent = "It's a draw!";
    scores.draw++;
  }
  youScore.textContent  = scores.you;
  cpuScore.textContent  = scores.cpu;
  drawScore.textContent = scores.draw;
}

function emptyCells(b) { return b.map((v,i) => v ? null : i).filter(i => i !== null); }

function minimax(b, isMax) {
  const res = checkWinner(b);
  if (res) {
    if (res.winner === CPU)    return  10;
    if (res.winner === PLAYER) return -10;
    return 0;
  }
  const moves = emptyCells(b);
  const sc = moves.map(i => {
    const nb = [...b];
    nb[i] = isMax ? CPU : PLAYER;
    return minimax(nb, !isMax);
  });
  return isMax ? Math.max(...sc) : Math.min(...sc);
}

function bestMove(b) {
  let best = -Infinity, move = -1;
  emptyCells(b).forEach(i => {
    const nb = [...b]; nb[i] = CPU;
    const s = minimax(nb, false);
    if (s > best) { best = s; move = i; }
  });
  return move;
}

function winOrBlock(b) {
  for (const i of emptyCells(b)) {
    const nb = [...b]; nb[i] = CPU;
    if (checkWinner(nb)?.winner === CPU) return i;
  }
  for (const i of emptyCells(b)) {
    const nb = [...b]; nb[i] = PLAYER;
    if (checkWinner(nb)?.winner === PLAYER) return i;
  }
  return null;
}

function cpuMove() {
  const empty = emptyCells(board);
  if (!empty.length) return;
  let idx;
  if (difficulty === 'easy') {
    idx = Math.random() < 0.8
      ? empty[Math.floor(Math.random() * empty.length)]
      : bestMove(board);
  } else if (difficulty === 'medium') {
    idx = winOrBlock(board) ?? empty[Math.floor(Math.random() * empty.length)];
  } else {
    idx = bestMove(board);
  }
  place(idx, CPU);
  const result = checkWinner(board);
  if (result) { endGame(result); return; }
  current = PLAYER;
  statusEl.textContent = 'Your turn';
}

cells.forEach(cell => {
  cell.addEventListener('click', () => {
    const i = +cell.dataset.i;
    if (over || boardLocked || board[i] || current !== PLAYER) return;
    place(i, PLAYER);
    const result = checkWinner(board);
    if (result) { endGame(result); return; }
    current = CPU;
    statusEl.textContent = 'CPU is thinking…';
    boardLocked = true;
    setTimeout(() => { cpuMove(); boardLocked = false; }, 400);
  });
});

document.getElementById('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
